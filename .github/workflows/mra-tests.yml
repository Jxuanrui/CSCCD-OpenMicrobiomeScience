name: mra-tests
on:
  push:
    paths: ["mra/**", ".github/workflows/mra-tests.yml"]
  pull_request:
    paths: ["mra/**"]
jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mra
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]  # 与本地 mra/.venv(3.11) 对齐双测（监工 X3 裁决）
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - name: Prepare runtime state (snapshot + method KB, both gitignored)
        run: |
          uv run python -c "from pathlib import Path; from mra.kg.snapshot import create_snapshot; create_snapshot(source=Path('../data/merged/candidate_v3'))"
          uv run python -c "from pathlib import Path; from mra.knowledge.method_rules import ingest_method_dir; print('KB:', ingest_method_dir(Path('knowledge/methods').resolve()))"
      - run: uv run pytest -q
        env:
          # 行为检查里跳过依赖宿主/网络/凭据的用例（与本地 skip 口径一致）
          ARK_API_KEY: ""
