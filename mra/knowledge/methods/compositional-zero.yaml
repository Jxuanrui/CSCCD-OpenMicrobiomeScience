content: 'trigger: 相对丰度/占比数据含零值并拟做 log/CLR 变换。

  risk: 零值策略缺失或隐式→变换不可复现、伪计数支配区风险（与 pseudocount-floor-001 配套）。

  action: 显式声明零值策略（伪计数量级/替换法）；非零中位丰度≤伪计数时列入可疑集。

  contraindication: 不得无声明地混用不同伪数量级的结果。

