content: 'trigger: 多批次宏基因组/宏转录组数据的跨批次分析。

  risk: 单一矩阵策略要么损失检验严谨性（校正后）要么损失无监督结构（不校正）。

  action: 双轨：检验轨保留原始矩阵+批次协变量；无监督轨用批次校正矩阵（校正时保护核心暴露变量）；校正矩阵不得用于 alpha 多样性。

  contraindication: 最小批次(N<15)慎做矩阵级校正。

  evidence_source: Method.md 批次整合方法（MMUPHin 双轨决策）。

  validation_status: validated_in_real_study

