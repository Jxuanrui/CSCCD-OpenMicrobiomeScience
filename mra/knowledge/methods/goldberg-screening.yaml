content: 'trigger: FFQ 膳食数据的能量合理性筛查。

  risk: 单一 d 参数口径下 FFQ 适配性无共识→分类不稳定（实测 254 人因 d 取值变类）。

  action: Goldberg 双方案（d=1 保守 / d→∞ 严格）并行作敏感性；低报者只标记不硬剔。

  contraindication: 不得单方案硬剔除；不得忽视 PAL 缺失样本。

  evidence_source: Method.md 阶段3（Black 2000/Bédard 2004 双方案决策）。

