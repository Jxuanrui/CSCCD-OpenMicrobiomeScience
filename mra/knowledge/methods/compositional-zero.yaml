id: method-compositional-zero-001
package: methods
title: 成分数据的零值策略必须显式声明
version: 1
evidence_level: confirmed_rule
applicability: 适用于相对丰度菌群矩阵的变换、距离、建模和审计。
source:
  - {kind: internal, ref: src/mra/audit AUDIT-COMP-001, date: '2026-09-12'}
approval: {status: approved, by: human, revision: seed-v1}
retired: false
content: |
  相对丰度是成分数据，CLR/ILR 对零值没有天然定义。必须记录 data_scale、变换方法、零值处理算法及参数。不能把 CLR 宣称为唯一正确方法；Bray-Curtis 等选择应结合研究问题和敏感性分析判断。
