id: method-batch-dual-track-001
package: methods
title: 菌群跨批次分析采用差异检验与无监督分析双轨
version: 1
evidence_level: confirmed_rule
applicability: 适用于多批次 MetaPhlAn4/HUMAnN3 结果的跨批次分析。
source:
  - {kind: internal, ref: Method.md 批次整合方法, date: '2026-09-12'}
  - {kind: literature, ref: MMUPHin Genome Biology 2022, date: '2022-06-01'}
approval: {status: approved, by: human, revision: seed-v1}
retired: false
content: |
  差异丰度和关联检验轨保留原始丰度矩阵，并将批次作为协变量或随机效应；无监督聚类、降维和机器学习输入轨可用 MMUPHin adjust_batch。校正时须保护核心膳食暴露变量。校正矩阵不能用于 alpha 多样性计算。
